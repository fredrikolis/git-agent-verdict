# Concern: the crate manifest — one binary, and the two dependencies it carries | Non-concern: how the binary is shipped (the release pipeline owns that) | IO: none

[package]
name = "git-agent-verdict"
version = "2.0.4"
edition = "2021"
description = "Verify that a commit message carries an attested review verdict"
license = "MIT"
repository = "https://github.com/fredrikolis/git-agent-verdict"
readme = "README.md"
keywords = ["git", "git-hook", "code-review", "commit-msg", "agents"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "git-agent-verdict"
path = "src/main.rs"

[profile.release]
strip = true

[dependencies]
serde_json = "1.0.151"
# What std does not reach: trapping a signal, locking a descriptor, and ending a process group.
libc = "0.2"
