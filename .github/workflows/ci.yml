name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Configure git for the e2e temp repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global init.defaultBranch main
      - name: Format
        run: cargo fmt --check
      # --locked: a lockfile mismatch builds fine but fails `cargo publish` after tagging.
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --all --locked

  gates:
    runs-on: ubuntu-latest
    env:
      ANNOTATED_TREE_VERSION: 0.6.0
      COMMENT_CRUSHER_VERSION: 0.2.0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Annotation gate
        run: npx --yes "annotated-tree@${ANNOTATED_TREE_VERSION}" --strict-check --include-tests .
      - name: Comment budget
        run: |
          set -eux
          cargo install --locked "comment-crusher@${COMMENT_CRUSHER_VERSION}"
          comment-crusher .

  # Contract: README hooks invoke this binary as `git agent-verdict`.
  git-subcommand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install and resolve as a git subcommand
        run: |
          set -eux
          cargo install --path . --locked
          git agent-verdict 2>&1 | grep -q 'usage: git-agent-verdict'
