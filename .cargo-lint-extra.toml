# Concern: which cargo-lint-extra rules run, and at what level | Non-concern: which comments earn their space (the knowledge-base standard) | IO: none

[global]
exclude = ["target"]

# A backstop against a runaway line, not a wrapping style: the first-line annotation is bounded at
# 200 by annotated-tree, which is the limit that shapes prose here.
[rules.line-length]
level = "deny"
soft_limit = 500
hard_limit = 500
url_exception = true

# A file is split when it takes on a second concern, not when it reaches a number. These bound the
# case where nobody noticed it had.
[rules.file-length]
level = "deny"
soft_limit = 1000
hard_limit = 1500

[rules.inline-comments]
level = "deny"
max_ratio = 0.20
max_consecutive = 1

[rules.file-comments]
level = "deny"
max_ratio = 0.20
count_doc_comments = true
max_consecutive = 1
max_doc_consecutive = 1

# Off deliberately, not by omission: performance and style opinions this repo has not adopted.
[rules.string-alloc-in-loop]
level = "allow"

[rules.clone-density]
level = "allow"

[rules.verbose-result-handling]
level = "allow"

[rules.redundant-comments]
level = "allow"

[rules.glob-imports]
level = "warn"

[rules.todo-comments]
level = "warn"
