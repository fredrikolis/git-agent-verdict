# Concern: the comment budget this repo holds itself to | Non-concern: what makes a comment worth keeping | IO: none
[rules.comment-ratio]
min_chars = 1000

[[allow]]
paths = ["README.md", "**/README.md"]
reason = "dev-agent essentials only, no other audience"
set = ["doc-length.max_lines=150"]

[[allow]]
paths = ["CHANGELOG.md"]
reason = "append-only release log; history is not comment bloat to prune"
set = ["doc-length.max_lines=2000"]
